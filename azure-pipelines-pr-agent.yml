# ────────────────────────────────────────────────────────────────
#  PRAgent on a SELF‑HOSTED Windows Azure DevOps agent
#  – minimal: no Python install, no Git clone of PR‑Agent, no pip
# ────────────────────────────────────────────────────────────────

trigger: none
pr:
  branches:
    include: ['*']     # run for every PR branch

pool:
  name: 'PRAgent_SelfHosted'  # Use your self-hosted agent pool name
  demands:
  - agent.os -equals Windows_NT  # or Linux depending on your agent

# ───────────── Variables & Secrets ─────────────
variables:
- name: PYTHONUTF8
  value: 1
- name: CSHARP_CODE_CONTEXT_SERVICE__BASE_URL
  value: http://localhost:7110
- name: CSHARP_CODE_CONTEXT_SERVICE__USERNAME
  value: Skatamatic

# duplicate keys PR‑Agent expects
- name: OPENAI__KEY
  value: $(OPENAI_KEY)
- name: ANTHROPIC__KEY
  value: $(ANTHROPIC_KEY)

# PR-Agent configuration for Azure DevOps
- name: AZURE_DEVOPS_CONFIG.PR_ACTIONS
  value: '["pullrequest"]'  # Which PR actions trigger the runner

stages:
- stage: pr_agent
  displayName: 'PR‑Agent'

  # skip bots
  # condition: |
  #   and(
  #     eq(variables['Build.Reason'], 'PullRequest'),
  #     not(contains(variables['Build.RequestedFor'], '[bot]'))
  #   )

  jobs:
  - job: run_agent
    displayName: 'Run PR‑Agent tools'
    timeoutInMinutes: 45

    steps:
    # ----------------------------------------------------------------
    # 1. Checkout repository with credentials for PR analysis
    # ----------------------------------------------------------------
    - checkout: self
      clean: true
      persistCredentials: true
      displayName: 'Checkout repository for PR analysis'

    # ----------------------------------------------------------------
    # 2. AUTO_* flags come from AI Config (configuration.toml) or
    #    Repository Manager per-repo settings via dashboard integration.
    #    Do not hardcode them here — pipeline env vars override TOML.
    # ----------------------------------------------------------------

    # ----------------------------------------------------------------
    # 3. Launch the agent
    # ----------------------------------------------------------------
    - powershell: |
        py -m pip install --upgrade pip
        py -m pip install -r "C:/pr_agent/pr-agent/requirements.txt"
        py "C:/pr_agent/pr-agent/pr_agent/servers/azuredevops_pipeline_runner.py"
      workingDirectory: $(System.DefaultWorkingDirectory)
      displayName: 'Execute PR‑Agent'
      env:
        # REQUIRED: Azure DevOps Environment Variables (auto-provided by Azure DevOps)
        BUILD_REASON: $(Build.Reason)
        SYSTEM_PULLREQUEST_PULLREQUESTID: $(System.PullRequest.PullRequestId)
        SYSTEM_TEAMPROJECT: $(System.TeamProject)
        BUILD_REPOSITORY_NAME: $(Build.Repository.Name)
        SYSTEM_COLLECTIONURI: $(System.CollectionUri)
        
        # REQUIRED: Authentication tokens
        AZURE_DEVOPS_PAT: $(System.AccessToken)
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        
        # REQUIRED: AI Model API Keys (configure these in Pipeline Variables)
        OPENAI_KEY: $(OPENAI_KEY)
        ANTHROPIC_KEY: $(ANTHROPIC_KEY)
        OPENAI__KEY: $(OPENAI_KEY)
        ANTHROPIC__KEY: $(ANTHROPIC_KEY)
        
        # OPTIONAL: OpenAI Organization
        OPENAI_ORG: $(OPENAI_ORG)
        
        # OPTIONAL: Dashboard (set DASHBOARD_URL in Pipeline Variables to report jobs/operations/logs)
        DASHBOARD_URL: $(DASHBOARD_URL)
        DASHBOARD_API_KEY: $(DASHBOARD_API_KEY)
        
        # OPTIONAL: C# Context Service (configure these in Pipeline Variables if using)
        CSHARP_CODE_CONTEXT_SERVICE__BASE_URL: $(CSHARP_CODE_CONTEXT_SERVICE__BASE_URL)
        CSHARP_CODE_CONTEXT_SERVICE__USERNAME: $(CSHARP_CODE_CONTEXT_SERVICE__USERNAME)
        CSHARP_CODE_CONTEXT_SERVICE__PASSWORD: $(CSHARP_CODE_CONTEXT_SERVICE__PASSWORD)
        
        # CONFIGURATION: Auto-run settings (configure these in Pipeline Variables)
        AZURE_DEVOPS_CONFIG.AUTO_DESCRIBE: $(AZURE_DEVOPS_CONFIG.AUTO_DESCRIBE)
        AZURE_DEVOPS_CONFIG.AUTO_REVIEW: $(AZURE_DEVOPS_CONFIG.AUTO_REVIEW)
        AZURE_DEVOPS_CONFIG.AUTO_IMPROVE: $(AZURE_DEVOPS_CONFIG.AUTO_IMPROVE)
        AZURE_DEVOPS_CONFIG.ENABLE_OUTPUT: $(AZURE_DEVOPS_CONFIG.ENABLE_OUTPUT)
        AZURE_DEVOPS_CONFIG.PR_ACTIONS: $(AZURE_DEVOPS_CONFIG.PR_ACTIONS)
        
        # SYSTEM: UTF8 encoding and Python path configuration
        PYTHONUTF8: 1
        PYTHONPATH: C:/pr_agent/pr-agent

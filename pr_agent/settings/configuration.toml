[config]
model = "bulk-test-model"
use_repo_settings_file = true
use_extra_bad_extensions = false
verbosity_level = 2
# Used by git_patch_processing.extend_patch / tests
patch_extension_skip_types = [".md", ".txt"]
max_extra_lines_before_dynamic_context = 10
allow_dynamic_context = false

[config.config]
verbosity_level = 2

# Required for pr_agent.servers.github_app (import-time) and unit tests that load server modules.
[github]
webhook_secret = ""

[github_app]
push_trigger_pending_tasks_ttl = 300
override_deployment_type = false

# Required when importing pr_agent.servers.gitlab_webhook (tests, tooling).
[gitlab]
url = "https://gitlab.com"

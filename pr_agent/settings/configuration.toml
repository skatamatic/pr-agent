[pr_code_suggestions]
max_context_tokens = 94000
commitable_code_suggestions = true
dual_publishing_score_threshold = -1
focus_only_on_problems = false
extra_instructions = "We are looking for suggestions in this priority order:\n1 - Critical bugs\n2 - Architectural/design concerns (such as not adhering to SOLID, DRY, KISS, principle of least surprise)\n3 - Multithreading/concurrency/deadlock/contention/threadpool exhaustion potential.  Generally prefer modern async code to explicitly multithreaded code unless there's a clear reason to prefer the thread management\n4 - Misused or naively implemented library calls (such as using .Result on async methods, or using suboptimal LINQ etc)\n5 - Readability and testability:\n    - Fit with the rest of the codebase.  Refer to the additional context for style/integration clues\n    - Small methods\n    - Early returns\n    - Good naming of classes/variables/methods\n    - Simplicity\n6 - Modern best practices (especially in async code)\n7 - Design patterns that could be applied or are misapplied\n8 - Test coverage.  We don't need to test every little thing, but key/complex functionality MUST have tests.\n9 - Performance.  When citing performance, be sure to include the time and space complexity (O notation) of the affected code before and after the suggestion.\n10 - Leaks and lifecycle management (ie dispose methods etc)\n11 - Anything else you find pertinent!\n\nDo not hesitate to be harsh with language if things are outright bad!  But try to remain empathetic (ie This code sucks, but we all make mistakes or I see why you did it this way but it's suboptimal).  \nWe require the utmost quality and scrutiny.  Leave as many comments as needed to ensure an extremely high quality codebase.  \nDo not be worried about offending the author - let them know when their code is bad and help make them better at their jobs.\nDon't beat around the bush!  This is important - do not hesitate to insult the code if it is objectively bad quality.\n\nFeel free to provide many many suggestions for even a small PR if needed.  In fact, it is encouraged to address the code as comprehensively as possible.\n"
enable_help_text = false
enable_chat_text = false
persistent_comment = true
max_history_len = 8
publish_output_no_suggestions = true
apply_suggestions_checkbox = true
suggestions_score_threshold = 0

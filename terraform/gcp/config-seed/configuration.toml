# Seed config for GCS; dashboard and PR-Agent use this bucket. Edit in dashboard to persist.
[config]
model = "anthropic/claude-sonnet-4-6-20250514"
model_weak = "gpt-4.1-mini"
fallback_models = ["gpt-4.1-mini"]
max_model_tokens = 94000
temperature = 0.2
verbosity_level = 2
publish_output = true
ai_timeout = 180
git_provider = "azure"

[pr_reviewer]
enabled = true
require_tests = false
auto_review = false

[pr_description]
enabled = true
publish_description = true

[pr_code_suggestions]
enabled = true
auto_improve = false

[csharp_code_context_service]
enabled = false
default_depth = 1
default_mode = "Minified"
timeout = 180

[enabled_actions]
pr_reviewer = true
pr_description = true
pr_code_suggestions = true
pr_questions = true
pr_test = false
pr_add_docs = false
pr_update_changelog = false

# Dashboard connection (auto-populated by backend on startup; edit here to override)
[dashboard]
url = ""

# Azure DevOps runner defaults (used when running via azure-pipelines-pr-agent-docker.yml)
[azure_devops_config]
auto_describe = true
auto_review = true
auto_improve = true
enable_output = true
pr_actions = ["pullrequest"]
